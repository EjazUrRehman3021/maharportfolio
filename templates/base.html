<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ejaz ur Rehman - Portfolio{% endblock %}</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav>
    <a href="/" class="{% if request.path == '/' %}active{% endif %}"><i class="fas fa-home"></i> Home</a>
    <a href="/about" class="{% if request.path == '/about' %}active{% endif %}"><i class="fas fa-user"></i> About</a>
    <a href="/skills" class="{% if request.path == '/skills' %}active{% endif %}"><i class="fas fa-laptop-code"></i> Skills</a>
    <a href="/projects" class="{% if request.path.startswith('/projects') %}active{% endif %}"><i class="fas fa-project-diagram"></i> Projects</a>
    <a href="/contact" class="{% if request.path == '/contact' %}active{% endif %}"><i class="fas fa-envelope"></i> Contact</a>
    <a href="/resume"><i class="fas fa-file-pdf"></i> CV</a>
</nav>

{% block content %}
{% endblock %}

<footer>
    <p>&copy; 2026 Ejaz ur Rehman | All Rights Reserved</p>
</footer>

</body>
</html>
