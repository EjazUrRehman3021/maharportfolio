{% extends 'base.html' %}
{% block title %}Contact - Ejaz ur Rehman{% endblock %}

{% block content %}
<div class="container">
    <h1><i class="fas fa-paper-plane" style="color: var(--accent-color);"></i> Contact Me</h1>
    <p>Feel free to reach out for electronics projects, AC repairing, or any other inquiries!</p>
    
    <div style="display: flex; flex-wrap: wrap; gap: 30px; justify-content: center; margin-top: 30px;">
        <!-- Social Links -->
        <div class="contact" style="display: flex; flex-direction: column; align-items: center; gap: 15px; flex: 1; min-width: 300px; max-width: 400px;">
            <a href="mailto:hafizejaz3021@gmail.com" class="btn-primary" style="width: 100%; justify-content: center; font-size: 1.1rem; padding: 15px; border-color: #ea4335; color: #ea4335; background: rgba(234, 67, 53, 0.05);"><i class="fas fa-envelope" style="margin-right: 10px;"></i> hafizejaz3021@gmail.com</a>
            
            <a href="https://wa.me/923377188399" target="_blank" rel="noopener noreferrer" class="btn-primary" style="width: 100%; justify-content: center; font-size: 1.1rem; padding: 15px; border-color: #25D366; color: #25D366; background: rgba(37, 211, 102, 0.05);"><i class="fab fa-whatsapp" style="margin-right: 10px;"></i> +92 337 7188399</a>
            
            <a href="https://www.linkedin.com/in/ejaz-rehman-163019283/" target="_blank" rel="noopener noreferrer" class="btn-primary" style="width: 100%; justify-content: center; font-size: 1.1rem; padding: 15px; border-color: #0077b5; color: #0077b5; background: rgba(0, 119, 181, 0.05);"><i class="fab fa-linkedin" style="margin-right: 10px;"></i> LinkedIn Profile</a>
        </div>

        <!-- Direct Email Form -->
        <div style="flex: 1; min-width: 300px; max-width: 500px; background: var(--card-bg); padding: 30px; border-radius: 16px; border: 1px solid var(--card-border); text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
            <h3 style="margin-top: 0; color: var(--text-primary);"><i class="fas fa-envelope-open-text" style="color: var(--accent-color);"></i> Send a Direct Message</h3>
            <form action="https://formsubmit.co/hafizejaz3021@gmail.com" method="POST" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
                <!-- FormSubmit Configuration -->
                <input type="hidden" name="_subject" value="New message from your Portfolio!">
                <input type="hidden" name="_captcha" value="false">
                
                <input type="text" name="name" placeholder="Your Name" required style="padding: 12px; border-radius: 8px; border: 1px solid var(--card-border); background: rgba(255,255,255,0.05); color: white; font-family: 'Outfit', sans-serif;">
                <input type="email" name="email" placeholder="Your Email Address" required style="padding: 12px; border-radius: 8px; border: 1px solid var(--card-border); background: rgba(255,255,255,0.05); color: white; font-family: 'Outfit', sans-serif;">
                <textarea name="message" placeholder="Write your message here..." rows="5" required style="padding: 12px; border-radius: 8px; border: 1px solid var(--card-border); background: rgba(255,255,255,0.05); color: white; font-family: 'Outfit', sans-serif; resize: vertical;"></textarea>
                
                <button type="submit" class="btn-primary" style="background: var(--accent-color); color: var(--bg-color); border: none; padding: 15px; font-weight: bold; font-size: 1.1rem; width: 100%; cursor: pointer;">Send Message <i class="fas fa-paper-plane" style="margin-left: 5px;"></i></button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
